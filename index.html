 aula:[['Tema',t],['Objetivo','Compreender e praticar "'+t+'" em '+m.k+', com autonomia adequada a '+G[g]+'.'],['Materiais','Folha de atividades, lápis, lápis de cor e materiais do trabalho prático.'],['Acolhida (10 min)','Roda de conversa: o que já sabemos sobre "'+t+'"?'],['Explicação (15 min)','Apresente o tema com exemplos do dia a dia, objetos ou imagens e resolva o 1º exercício junto com a turma.'],['Prática (20 min)','1) '+a+'<br>2) '+b+'<br>3) '+c],['Trabalho prático',w],['Avaliação','Observe participação, compreensão e autonomia; anote quem precisa de apoio.'],['Fechamento (5 min)','Cada criança responde: "O que eu descobri hoje?"']],
 sem:[['Segunda','Sondagem e apresentação de "'+t+'": roda de conversa e exemplos.'],['Terça','Exercício 1: '+a],['Quarta','Exercício 2: '+b],['Quinta','Exercício 3: '+c],['Sexta','Trabalho prático: '+w+'<br>Roda de avaliação da semana.'],['Avaliação','Observação diária, correção coletiva das folhas e registro de participação.']],
 mes:[['Objetivo do mês','Dominar "'+t+'" em '+m.k+' com atividades graduais e produção final.'],['Semana 1','Sondagem, apresentação do tema e exercício 1: '+a],['Semana 2','Exercício 2: '+b+'<br>Atividade em duplas para reforço.'],['Semana 3','Exercício 3: '+c+'<br>Jogos ou leitura de aprofundamento.'],['Semana 4','Trabalho prático: '+w+'<br>Revisão e avaliação do mês.'],['Avaliação','Folhas corrigidas, trabalho prático e autoavaliação da turma.']],
 tri:[['Objetivos do trimestre','Desenvolver, em '+m.k+' para '+G[g]+', as habilidades do tema "'+t+'": compreender, praticar e produzir.'],['Mês 1 · Introdução','Sondagem inicial, apresentação do tema e exercício 1: '+a+'<br>Quatro semanas de atividades curtas de familiarização.'],['Mês 2 · Prática','Exercícios 2 e 3: '+b+' / '+c+'<br>Atividades em duplas, jogos e revisão semanal.'],['Mês 3 · Produção e avaliação','Trabalho prático: '+w+'<br>Apresentação para a turma, avaliação final e portfólio.'],['Avaliação do trimestre','Observação contínua, folhas de atividades, trabalho prático e autoavaliação; relatório de acompanhamento por criança.']]
 }[v];
 const per={aula:'1 aula',sem:'1 semana',mes:'1 mês (4 semanas)',tri:'1 trimestre'}[v];
 return `<article class="sheet" style="--c:${m.c};--s:${m.s}">
 <div class="sh"><div><h3>${m.k} — ${G[g]}</h3><small>${LB[v]} • ${per}</small></div><div class="ic">${m.e}</div></div>
 <div class="f"><div>Professor(a):</div><div><b>Matéria:</b> ${m.k}</div><div><b>Série:</b> ${G[g]}</div></div>
 <div class="tema"><b>Tema:</b> ${t}</div>
 <table class="tb">${R.map(x=>`<tr><th>${x[0]}</th><td>${x[1]}</td></tr>`).join('')}</table>
 <div class="q"><p><b>✎</b>Observações do professor</p><i></i><i></i></div>
 <div class="ft"><span>${m.p}</span><span>Professor no Bolso</span></div></article>`;
}
const SV=(h,b)=>`<svg viewBox="0 0 520 ${h}" class="fg" font-family="Arial">${b}</svg>`;
const bx=(x,y)=>`<rect x="${x}" y="${y}" width="46" height="46" rx="8" fill="#fff" stroke="#999" stroke-width="2"/>`;
const F={
 let:t=>SV(100,`<text x="10" y="80" font-size="84" font-weight="900" fill="none" stroke="#7a8aa0" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round" letter-spacing="14">${t}</text>`),
 row:(a,b)=>SV(80,a.map((e,i)=>`<text x="${12+i*70}" y="56" font-size="46">${e}</text>`).join('')+(b?bx(12+a.length*70,14):'')),
 cnt:(e,n)=>SV(80,Array.from({length:n},(_,i)=>`<text x="${12+i*62}" y="56" font-size="44">${e}</text>`).join('')+`<text x="395" y="52" font-size="24">=</text>`+bx(440,14)),
 seq:a=>F.row(a,1),
 shp:()=>SV(120,`<g fill="#fff" stroke="#555" stroke-width="4"><circle cx="70" cy="60" r="44"/><rect x="170" y="16" width="88" height="88" rx="4"/><polygon points="345,14 395,104 295,104"/><polygon points="455,10 467,44 503,46 475,66 485,102 455,82 425,102 435,66 407,46 443,44"/></g>`),
 mat:(l,r)=>SV(200,l.map((e,i)=>`<text x="20" y="${52+i*62}" font-size="40">${e}</text><circle cx="110" cy="${40+i*62}" r="9" fill="#555"/><circle cx="395" cy="${40+i*62}" r="9" fill="#555"/><text x="418" y="${47+i*62}" font-size="22" font-weight="700">${r[i]}</text>`).join('')),
 path:(a,b)=>SV(130,`<text x="10" y="80" font-size="50">${a}</text><text x="440" y="80" font-size="50">${b}</text><path d="M75 65 C140 0 200 130 270 65 S380 30 435 65" fill="none" stroke="#E9846A" stroke-width="5" stroke-dasharray="4 12" stroke-linecap="round"/>`),
 faces:a=>SV(100,a.map((e,i)=>`<circle cx="${70+i*125}" cy="50" r="46" fill="#fff" stroke="#999" stroke-width="2.5"/><text x="${70+i*125}" y="66" font-size="46" text-anchor="middle">${e}</text>`).join('')),
 col:a=>SV(130,a.map((x,i)=>`<circle cx="${80+i*180}" cy="48" r="40" fill="#fff" stroke="${x[1]}" stroke-width="5"/><text x="${80+i*180}" y="115" font-size="20" font-weight="700" text-anchor="middle" fill="${x[1]}">${x[0]}</text>`).join('')),
 order:a=>SV(130,a.map((e,i)=>`<text x="${40+i*170}" y="56" font-size="50">${e}</text>`+bx(42+i*170,72)).join('')),
 box:t=>`<div class="dw">✏️ ${t}</div>`
};
const J=[
()=>[['Cubra o pontilhado das vogais.',F.let('A E I O U')],['Ligue a figura à letra do começo do nome.',F.mat(['🍌','🐶','🌞'],['S','B','C'])],['',F.box('Desenhe algo que começa com a letra do seu nome.')]],
()=>[['Conte e escreva quantos.',F.cnt('🍎',3)],['Continue o padrão.',F.seq(['🔴','🔵','🔴','🔵'])],['Pinte as formas.',F.shp()]],
()=>[['Ligue o sentido ao órgão.',F.mat(['👁️','👂','👃'],['cheirar','ver','ouvir'])],['Circule o que é ser vivo.',F.faces(['🐱','🪨','🌳','🚗'])],['',F.box('Desenhe o que a planta precisa para crescer.')]],
()=>[['Numere do mais novo ao mais velho.',F.order(['🧑','👶','🧒'])],['Circule quem mora com você.',F.faces(['👨','👩','👵','🧒'])],['',F.box('Desenhe a sua família.')]],
()=>[['Siga o caminho de casa até a escola.',F.path('🏠','🏫')],['Conte as árvores do bairro.',F.cnt('🌳',4)],['',F.box('Desenhe a sua rua.')]],
()=>[['Pinte cada círculo com a cor do nome.',F.col([['Azul','#2457A6'],['Amarelo','#D9A400'],['Vermelho','#D64545']])],['Pinte as formas com cores bonitas.',F.shp()],['',F.box('Desenho livre: faça uma obra de arte!')]],
()=>[['Circule como você se sente hoje.',F.faces(['😊','😢','😠','😟'])],['Ligue a carinha à emoção.',F.mat(['😊','😢','😠'],['raiva','alegria','tristeza'])],['',F.box('Desenhe algo que deixa você calmo.')]],
()=>[['Conte os limões da barraquinha.',F.cnt('🍋',4)],['Ligue o produto ao preço da lojinha.',F.mat(['🍋','🍎','🍰'],['R$ 5','R$ 3','R$ 1'])],['',F.box('Desenhe o seu produto para vender.')]],
()=>[['Siga as setas até a estrela.',F.row(['➡️','➡️','⬇️','⬇️','⭐'])],['Continue o padrão do robô.',F.seq(['🤖','⚙️','🤖','⚙️'])],['',F.box('Desenhe o seu robô.')]]
];
function sheetJ(i){
 const m=S[i],[t,,,,w]=m.d[0].split('|'),A=J[i]();
 return `<article class="sheet jd" style="--c:${m.c};--s:${m.s}">
 <div class="sh"><div><h3>${m.k} — ${G[0]}</h3><small>Folha de atividades • Pinte, cubra, ligue e desenhe!</small></div><div class="ic">${m.e}</div></div>
 <div class="f"><div>Nome:</div><div>Turma:</div><div>Data:</div></div>
 <div class="tema"><b>Tema:</b> ${t}</div>
 ${A.map((x,n)=>`<div class="q"><p><b>${n+1}</b>${x[0]||'Mostre sua criatividade!'}</p>${x[1]}</div>`).join('')}
 <div class="w"><strong>✂️ Trabalho prático</strong><p>${w}</p></div>
 <div class="se"><b>Como me saí?</b> 😊 &nbsp; 😐 &nbsp; 😟 <span>Visto: ________</span></div>
 <div class="ft"><span>${m.p}</span><span>Professor no Bolso</span></div></article>`;
}
function doc(i){return v==='ativ'?(g===0?sheetJ(i):sheet(i)):plan(i)}
let rl='prof',Q={};
const ROLES=[['prof','👩‍🏫 Professor'],['coord','🧭 Coordenação'],['dir','🏫 Direção'],['alu','🎒 Aluno']];
const ld=()=>{try{return JSON.parse(localStorage.getItem('pnb')||'{}')}catch(e){return{}}};
const sv=o=>{try{localStorage.setItem('pnb',JSON.stringify(o))}catch(e){}};
function tog(k){const o=ld();o[k]=o[k]?0:1;sv(o);render()}
const gch=()=>`<div class="chips">`+G.map((x,i)=>`<button class="${i===g?'on':''}" onclick="g=${i};Q={};render()">${x}</button>`).join('')+`</div>`;
function pct(gi,x){const o=ld();let n=0;S.forEach((_,i)=>{if(o[gi+'-'+i+x])n++});return Math.round(n/9*100)}
const bars=gi=>['p','a','v'].map((x,j)=>`<div class="pg"><span>${['Planejado','Aplicado','Avaliado'][j]}</span><i><u style="width:${pct(gi,x)}%"></u></i><b>${pct(gi,x)}%</b></div>`).join('');
function coord(){
 const o=ld();
 const rows=S.map((m,i)=>{const k=g+'-'+i,cb=x=>`<td><input type="checkbox" ${o[k+x]?'checked':''} onchange="tog('${k+x}')"></td>`;
 return `<tr><td>${m.e} <b>${m.k}</b></td><td>${m.d[g].split('|')[0]}</td>${cb('p')}${cb('a')}${cb('v')}<td><button class="mini" onclick="rl='prof';s=${i};v='aula';render()">Abrir plano</button></td></tr>`}).join('');
 return `<section class="pn"><h3>🧭 Painel da Coordenação</h3><p>Marque o que foi planejado, aplicado e avaliado em ${G[g]}. Os registros ficam salvos neste aparelho.</p>${gch()}<div class="sc"><table class="mt"><tr><th>Matéria</th><th>Tema</th><th>Planejado</th><th>Aplicado</th><th>Avaliado</th><th></th></tr>${rows}</table></div>${bars(g)}<p><button class="btn" onclick="window.print()">🖨️ Imprimir painel</button></p></section>`;
}
function dir(){
 const T=[['1º trimestre','Fev–Mai','Acolhida e diagnóstico, reunião de pais, avaliação do trimestre'],['2º trimestre','Jun–Set','Projetos integrados, feira de ciências e empreendedorismo, conselho de classe'],['3º trimestre','Out–Dez','Avaliação final, mostra de robótica, relatório de aprendizagem']];
 let tot=0;G.forEach((_,i)=>{tot+=pct(i,'p')+pct(i,'a')+pct(i,'v')});tot=Math.round(tot/15);
 return `<section class="pn"><h3>🏫 Painel da Direção</h3><p>Visão geral do planejamento da escola, de Jardim ao 4º ano.</p>
 <div class="kp"><div><b>${tot}%</b>concluído</div><div><b>5</b>séries</div><div><b>9</b>matérias</div><div><b>45</b>folhas + planos</div></div>
 <h4>Andamento por série</h4><div class="g2">${G.map((x,i)=>`<div class="card2"><b>${x}</b>${bars(i)}</div>`).join('')}</div>
 <h4>Calendário sugerido</h4><div class="g2">${T.map(x=>`<div class="card2"><b>${x[0]}</b> • ${x[1]}<br>${x[2]}</div>`).join('')}</div>
 <h4>Ações da gestão</h4><ul class="ls"><li>Reunião pedagógica semanal com a coordenação</li><li>Formação continuada dos professores a cada trimestre</li><li>Reunião com as famílias no início de cada trimestre</li><li>Apoiar as turmas e matérias com menor avanço no painel</li></ul>
 <p><button class="btn" onclick="window.print()">🖨️ Imprimir relatório</button></p></section>`;
}
const rnd=n=>Math.floor(Math.random()*n);
function newQ(){let r,t,a,b;
 if(g===0){r=1+rnd(5);t='Quantas figuras? '+'🍎'.repeat(r)}
 else if(g===1){a=1+rnd(6);b=1+rnd(5);t=a+' + '+b;r=a+b}
 else if(g===2){a=8+rnd(10);b=1+rnd(9);t=a+' + '+b;r=a+b}
 else{a=2+rnd(g===3?4:8);b=2+rnd(8);t=a+' × '+b;r=a*b}
 const o=new Set([r]);let d=1;while(o.size<4){o.add(Math.max(0,r+(rnd(2)?d:-d)));d++}
 Q={t,r,o:[...o].sort((x,y)=>x-y)};
}
function ans(n){const o=ld();if(n===Q.r){o.st=(o.st||0)+1;sv(o);newQ();Q.m='⭐ Muito bem! Próxima:'}else Q.m='💪 Tente de novo!';render()}
function alu(){
 const o=ld(),m=S[s],[t,a,b,c,w]=m.d[g].split('|'),ms=[a,b,c,'✂️ '+w],k=n=>'m'+g+'-'+s+'-'+n;
 const dn=ms.filter((_,n)=>o[k(n)]).length;if(!Q.t)newQ();
 return `<section class="pn"><h3>🎒 Espaço do Aluno</h3>${gch()}<div class="chips" style="margin-top:10px">${S.map((x,i)=>`<button class="${i===s?'on':''}" onclick="s=${i};render()">${x.e} ${x.k}</button>`).join('')}</div>
 <div class="ms" style="--c:${m.c};--s:${m.s}"><h4>${m.e} ${m.k} — ${t}</h4>${ms.map((x,n)=>`<label class="mi"><input type="checkbox" ${o[k(n)]?'checked':''} onchange="tog('${k(n)}')">${x}</label>`).join('')}<p style="color:#243247"><b>${dn===4?'🏆 Parabéns! Missão cumprida!':'⭐ '+dn+' de 4 missões concluídas'}</b></p></div>
 <div class="gm"><h4>🎮 Desafio rápido</h4><p class="qq">${Q.t}</p><div>${Q.o.map(n=>`<button class="op" onclick="ans(${n})">${n}</button>`).join('')}</div><p>${Q.m||''}</p><p>⭐ Estrelas ganhas: ${o.st||0}</p></div></section>`;
}
function render(){
 $('rl').innerHTML=ROLES.map(x=>`<button class="${x[0]===rl?'on':''}" onclick="rl='${x[0]}';render()">${x[1]}</button>`).join('');
 const P=rl==='prof';$('pc').style.display=P?'':'none';
 if(P){render0();return}
 $('hd').textContent=ROLES.find(x=>x[0]===rl)[1]+' • '+G[g];
 $('out').innerHTML={coord:coord,dir:dir,alu:alu}[rl]();
}
function render0(){
 $('gr').innerHTML=G.map((x,i)=>`<button class="${i===g?'on':''}" onclick="g=${i};render()">${x}</button>`).join('');
 $('sb').innerHTML=S.map((m,i)=>`<button class="sub ${i===s?'on':''}" style="--c:${m.c};--s:${m.s}" onclick="s=${i};render()"><em>${m.e}</em><b>${m.k}</b></button>`).join('');
 $('tp').innerHTML=V.map(x=>`<button class="${x[0]===v?'on':''}" onclick="v='${x[0]}';render()">${x[1]}</button>`).join('');
 $('hd').textContent=S[s].k+' • '+G[g];
 $('out').innerHTML=doc(s);
}
function all(){$('out').innerHTML=S.map((_,i)=>doc(i)).join('');window.print();render()}
render();
</script>
